<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nhã Vương Miên — Kim cương vàng đồng trên nền xanh rêu">
  <defs>
    <linearGradient id="mossBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35563C" />
      <stop offset="55%" stop-color="#2C4832" />
      <stop offset="100%" stop-color="#203725" />
    </linearGradient>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6DDA0" />
      <stop offset="55%" stop-color="#D7A857" />
      <stop offset="100%" stop-color="#B68232" />
    </linearGradient>
    <linearGradient id="goldSideL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C278" />
      <stop offset="100%" stop-color="#9A6B25" />
    </linearGradient>
    <linearGradient id="goldSideR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C99645" />
      <stop offset="100%" stop-color="#7E531A" />
    </linearGradient>
    <linearGradient id="goldBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DFB463" />
      <stop offset="100%" stop-color="#8B5E20" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#mossBg)" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#C99A4B" stroke-opacity="0.22" stroke-width="2" />

  <!-- Faceted Bronze-Gold Diamond -->
  <g stroke="#6B4414" stroke-width="2" stroke-linejoin="round">
    <!-- Crown left & right outer facets -->
    <polygon points="154,142 206,142 178,214 102,214" fill="url(#goldSideL)" />
    <polygon points="306,142 358,142 410,214 334,214" fill="url(#goldSideR)" />
    <!-- Crown inner facets -->
    <polygon points="206,142 256,142 214,214 178,214" fill="#F0CF87" />
    <polygon points="256,142 306,142 334,214 298,214" fill="#C99848" />
    <!-- Crown center table -->
    <polygon points="206,142 306,142 298,214 214,214" fill="url(#goldTop)" />

    <!-- Pavilion outer left & right facets -->
    <polygon points="102,214 178,214 256,392" fill="url(#goldSideL)" />
    <polygon points="334,214 410,214 256,392" fill="#7D531B" />
    <!-- Pavilion inner left & right facets -->
    <polygon points="178,214 214,214 256,392" fill="#E4BA6C" />
    <polygon points="298,214 334,214 256,392" fill="#9E6E28" />
    <!-- Pavilion center facet -->
    <polygon points="214,214 298,214 256,392" fill="url(#goldBase)" />
  </g>
</svg>
